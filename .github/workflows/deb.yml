name: Debian Packages + apt repo

# Rolling release: every GREEN push to main builds python3-netgear-switch-library
# for Debian trixie AND sid and republishes a signed flat apt repository on
# GitHub Pages (https://mith.ro/python-netgear-switch-library/). Mirrors the
# pattern used by other mithro apt-repo projects (sensors2mqtt, ten64-controller).
# The package is Architecture: all (pure Python), so it builds on the default x86
# runner and installs on any Debian arch. The version is git-derived (vX.Y at a
# tag, vX.Y.postN after it -- identical to the wheel's).
#
# Gated on CI exactly like publish-pypi.yml: triggered when the "CI" workflow
# completes for main, and build-deb only proceeds when that run succeeded, so a
# red commit never reaches the apt repo. workflow_dispatch stays for re-runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-deb:
    # workflow_run fires on every completion (failure/cancelled too); only a
    # successful CI run is a release. publish-apt inherits the skip via needs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, sid]
    steps:
      - uses: actions/checkout@v5
        with:
          # Pin to the SHA CI validated, not the default-branch HEAD (which a
          # workflow_run checkout would otherwise use and may already be past).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # full history + tags so deb-version.py can describe

      - name: Build package in debian:${{ matrix.suite }}
        run: |
          docker run --rm \
            -v "${PWD}:/src" -w /src \
            docker.io/library/debian:${{ matrix.suite }} \
            sh packaging/ci-build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.suite }}
          path: built-debs/

  publish-apt:
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Download trixie debs
        uses: actions/download-artifact@v8
        with:
          name: debs-trixie
          path: apt-repo/trixie/

      - name: Download sid debs
        uses: actions/download-artifact@v8
        with:
          name: debs-sid
          path: apt-repo/sid/

      - name: Generate apt repo metadata (per suite)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils
          cp packaging/apt-index.html apt-repo/index.html
          for suite in trixie sid; do
            cd "apt-repo/$suite"
            dpkg-scanpackages --multiversion . > Packages
            gzip -k -f Packages
            {
              echo "Origin: python-netgear-switch-library"
              echo "Label: python-netgear-switch-library"
              echo "Suite: stable"
              echo "Codename: $suite"
              echo "Architectures: all"
              echo "Components: main"
              echo "Description: netgear-switch-library apt repo ($suite)"
            } > Release
            apt-ftparchive release . >> Release
            cd ../..
          done

      - name: Sign repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -eux
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --armor --export > apt-repo/netgear-switch.gpg
          for suite in trixie sid; do
            cd "apt-repo/$suite"
            gpg --batch --yes --armor --detach-sign --output Release.gpg Release
            gpg --batch --yes --armor --clearsign --output InRelease Release
            cd ../..
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apt-repo/

      - id: deploy
        uses: actions/deploy-pages@v5
