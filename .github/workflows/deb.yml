name: Debian packages

# Rolling release: every push to main runs the gates (ruff, mypy --strict,
# pytest with coverage >= 90, the documentation build), builds
# python3-netgear-switch-library for each suite and republishes a signed apt
# repository per suite on GitHub Pages
# (https://mith.ro/python-netgear-switch-library/<suite>/). The package is
# Architecture: all (pure Python), so one x86 build per suite serves every
# architecture. A pull request runs the same gates and builds, and publishes
# nothing. The version is git-derived (vX.Y at a tag, vX.Y.postN after it --
# identical to the wheel's).
#
# publish-pypi.yml is triggered by this workflow completing on main, and
# proceeds only when it succeeded. Renaming this workflow breaks that trigger.
#
# This follows mithro/apt-repo-action's docs/packaging.md; the differences
# from its defaults are declared in .github/apt-packaging.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  # A newer push to a pull request cancels the older build. On the default
  # branch a running publish is never cancelled: the newest push waits for it,
  # and replaces any older push still waiting (it contains that one's commits).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The same gates as local development. A green run is what "mergeable"
    # means.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The documentation is built once, on the newest Python.
          - python-version: "3.13"
            docs: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so hatch-vcs can derive the version

      # The build generates debian/changelog: apt-repo-action's shared
      # scripts/deb-version.py writes the build's entry, with the version
      # derived from git. Committing a build's output would pin a stale
      # version (and name a commit that may not exist), so it must not be
      # tracked. (This job runs on the runner, not in a container, so git is
      # already there and the checkout is a real clone.)
      - name: debian/changelog is not committed
        run: |
          git rev-parse --is-inside-work-tree
          if git ls-files --error-unmatch debian/changelog; then
            echo "::error file=debian/changelog::debian/changelog is committed, but the build generates it: git rm it"
            exit 1
          fi

      - name: Install net-snmp CLI (system dependency for the sync transport)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends snmp

      - uses: astral-sh/setup-uv@v7

      - name: Install the matrix Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync all extras and the dev group
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Tests + coverage gate (>= 90)
        run: uv run pytest

      # The published documentation generates its model/backend support tables
      # from the library itself and links every file reference to the file, so
      # a stale table or a renamed file is a build failure rather than a page
      # that quietly misleads. Warnings are errors here exactly as they are on
      # Read the Docs (see .readthedocs.yaml's fail_on_warning).
      #
      # Read the Docs' EXACT invocation, `-j auto` included. That flag matters:
      # a parallel read needs every registered Sphinx domain to implement
      # merge_domaindata, and sphinx-argparse's does not -- which broke the
      # published build while a gate without `-j auto` stayed green. Run what
      # production runs.
      - name: Build the documentation (Read the Docs' command, warnings are errors)
        if: matrix.docs
        run: >
          uv run python -m sphinx -T -W --keep-going -j auto -b html
          -d docs/_build/doctrees -D language=en docs docs/_build/html

      - name: Upload the built documentation
        if: matrix.docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7

  build-deb:
    name: build-deb (${{ matrix.suite }} ${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, sid]
        arch: [all]
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags: the version is git describe's

      # The shared build: debian:<suite>, build deps from debian/control, and
      # the version from the shared deb-version.py (with ~deb<R>, and ~pr<P>
      # on a pull request). Writes the .debs to built-debs/.
      - name: Build
        uses: mithro/apt-repo-action/build-deb@main
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          retention-days: 14

  publish-apt:
    # Build and test pull requests, but never publish from one (or from any
    # branch but main): that would overwrite the live repository with
    # unreviewed packages.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build-deb
    # Scoped to this job alone. A job calling a reusable workflow sets the
    # maximum permissions available to it, so the elevated Pages scopes stay
    # here rather than applying to the whole workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie sid"
      # Pure Python: one Architecture: all deb serves every architecture.
      architectures: "all"
      description: "Python library and CLI (ngsw) for Netgear switches"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
