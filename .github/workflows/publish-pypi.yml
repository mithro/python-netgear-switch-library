name: Publish to PyPI

# Every push to main is a release. The version is derived from git by
# hatch-vcs (see pyproject.toml), so each commit produces a new, unique
# version -- no tag, no manual bump. Publishing uses PyPI Trusted Publishing
# (OIDC): there is no API token in the repo. FINAL HUMAN SETUP STEP: register
# this repo+workflow as a trusted publisher on PyPI and create the `pypi`
# environment (see RELEASING.md). Until that is done the build job still
# runs and the publish job is a no-op-safe gate.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for hatch-vcs version derivation

      - uses: astral-sh/setup-uv@v6

      - name: Build sdist + wheel
        run: uv build

      - name: Show derived version
        run: ls -1 dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing requires an OIDC token and a named environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
