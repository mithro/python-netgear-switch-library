name: CI

# Runs the SAME gates as local development (ruff, mypy --strict, pytest with
# coverage >= 90) on every push to main and every pull request. A green run here
# is what "mergeable" means -- and what "releasable" means: publish-pypi.yml and
# deb.yml are triggered by this workflow COMPLETING on main and proceed only
# when it succeeded (workflow_run + conclusion check), so a red push to main
# is never published. Renaming this workflow breaks that trigger.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so hatch-vcs can derive the version

      - name: Install net-snmp CLI (system dependency for the sync transport)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends snmp

      - uses: astral-sh/setup-uv@v7

      - name: Install the matrix Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync all extras and the dev group
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type-check (mypy --strict)
        run: uv run mypy

      - name: Tests + coverage gate (>= 90)
        run: uv run pytest

  docs:
    # The published documentation generates its model/backend support tables
    # from the library itself and links every file reference to the file, so a
    # stale table or a renamed file is a build failure rather than a page that
    # quietly misleads. Warnings are errors here exactly as they are on Read
    # the Docs (see .readthedocs.yaml's fail_on_warning).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so hatch-vcs can derive the version

      - uses: astral-sh/setup-uv@v7

      - name: Sync the docs extra
        run: uv sync --extra docs

      # Read the Docs' EXACT invocation, `-j auto` included. That flag matters:
      # a parallel read needs every registered Sphinx domain to implement
      # merge_domaindata, and sphinx-argparse's does not -- which broke the
      # published build while a gate without `-j auto` stayed green. Run what
      # production runs.
      - name: Build the documentation (Read the Docs' command, warnings are errors)
        run: >
          uv run python -m sphinx -T -W --keep-going -j auto -b html
          -d docs/_build/doctrees -D language=en docs docs/_build/html

      - name: Upload the built documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
