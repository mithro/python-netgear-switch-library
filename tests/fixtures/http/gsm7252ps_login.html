function pausecomp(millis)
{
var date = new Date();
var curDate = null;

do { curDate = new Date(); }
while(curDate-date < millis);
}

function screen_refresh()
{
  document.forms[0].elements['submt'].value = 0x10;
  document.forms[0].submit();
  pausecomp(2000);
}

function DisplayErrorMsg()
//******************************************************************************
//* Purpose: Display an input error message.
//* Return:  none
//******************************************************************************
{
    alert(document.forms[0].err_msg.value);
}

function CheckError()
{
  var cookieEnabled=false;

  document.cookie="testcookie";
  cookieEnabled=(document.cookie.indexOf("testcookie")!=-1)? true : false;
  
  if (cookieEnabled == false)
  {
    alert("Browser does not accept cookies. Please configure your browser to accept cookies in order to access the Web Interface.");
  }
  
  if (document.forms[0].err_flag.value == 1) {
     DisplayErrorMsg();
  }

  document.forms[0].uname.focus();

}

</script>
