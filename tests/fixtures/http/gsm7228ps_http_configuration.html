<head>

<META http-equiv="Pragma" content="no-cache">
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=iso-8859-1"> <!-- Style Sheet link and Meta data -->
  <TITLE>NETGEAR S3300-52X-PoE+</TITLE>     <!-- Cheetah Page Title		 -->
  <script type="text/javascript" src="/base/js/jquery-3.5.1.min.js"></script>
  <link type="text/css" href="/base/chosen.css" rel="stylesheet">
  <link type="text/css" href="/css/ng8xui.css" rel="stylesheet">
  <script src="/base/js/rollover.js" type="text/javascript"></script>
  <script src="/base/js/browser.js" type="text/javascript"></script>
  <script type="text/javascript" src="/base/js/chosen.jquery.js"></script>
  <script type="text/javascript" src="/scripts/NetGearAppJS.js"></script>
  <script type="text/javascript"> Facet = new Image(176,56); Facet.src = '/base/images/Pop-Up-Window-Facet-Graphic.png'; Ok_img = new Image(57,22); Ok_img.src = '/base/images/Ok_on.gif'; Icon_close = new Image(14,14); Icon_close.src = '/base/images/icon_close.png'; Progres = new Image(248,22); Progres.src = '/base/images/progressbar.gif';</script>
  <script type="text/javascript" src="/base/js/xui_enhancements.js"></script>
  <script type='text/javascript' language='JavaScript'>
    function DisplayErrorMsg()
    {
      alert(document.forms[0].err_msg.value);
    }

    function CheckError()
    {
      if (document.forms[0].err_flag.value == 1)
      {
        DisplayErrorMsg();
      }
    }

    function enableButtonLocal()
    {
      for (var i = 0; i < arguments.length; i++)
      {
        elment = top.document.getElementById(arguments[i].split("~")[0]);
        if (elment != null)
        {
          ln = elment.src.length - 7;
          temp = elment.src.substring(ln, elment.src.length);
          if (temp == "off.gif")
          {
            elment.src = elment.src.substring(0, ln) + "on.gif";
            elment.disabled = false;
          }
        }
      }
    }

    function disableButtonLocal()
    {
      for (var i = 0; i < arguments.length; i++)
      {
        elment = top.document.getElementById(arguments[i].split("~")[0]);
        if (elment != null)
        { 
          ln = elment.src.length - 6;
          temp = elment.src.substring(ln, elment.src.length);
          if (temp == "on.gif")
          {
            elment.src = elment.src.substring(0, ln) + "off.gif";
            elment.disabled = true;
          }
        }
      }
    }

    function init_controls()
    {
      top.submitformForHTTP = function submitformForHTTP()
      {
        elment = parent.document.getElementById('btn_Apply');
        ln = elment.src.length - 6;
        temp = elment.src.substring(ln, elment.src.length);
        if (temp == "on.gif")
        {
          disableButtonLocal('btn_Apply', 'btn_Cancel', 'btn_reauthenticate', 'btn_initialize', 'btn_force');
        }

        document.forms[0].elements['submt'].value = 0x10;
        document.forms[0].submit();
        setTimeout('document.getElementById("hidden_frame").contentWindow.location.replace("ping")', 1000);
      }



      document.getElementById("httpSoftTimeout").disabled = false;
      document.getElementById("httpHardTimeout").disabled = false;
      document.getElementById("httpMaxSessions").disabled = false;
    }

  </script>
</head>
<body onload="CheckError();init_controls();verifyParentWindow()" class="overflowYHidden">
<FORM method="post" ACTION="/httpConfiguration_rw.html">
  <div class="mainBody mainContainer">
    <table class="detailsContainer">
      <tr>
        <td><table class="tableStyle">
            <tr>
              <td colspan="3"><script>tbhdr('HTTP Configuration', 'httpConfiguration')</script></td>
            </tr>
            <tr>
              <td class="spacer100Percent paddingsubSectionBody">
                <table class="tableStyle">


                  <tr class="deftestme whiteSpaceNoWrap">
                    <td class="defLeft">HTTP Session Soft Timeout (Minutes)</td>
                    <td class="defRight" colspan="3">
                        <INPUT TYPE="TEXT" class="input" id="httpSoftTimeout" name="httpSoftTimeout" onKeyPress="enableButtonLocal('btn_Apply', 'btn_Cancel');" SIZE="17" MAXLENGTH="2" VALUE="5">
                        <span class="argHelp">
                           (0 to 60)
                        </span>
                    </td>
                  </tr>
                  <tr class="deftestme whiteSpaceNoWrap">
                    <td class="defLeft">HTTP Session Hard Timeout (Hours)</td>
                    <td class="defRight" colspan="3">
                        <INPUT TYPE="TEXT" class="input" id="httpHardTimeout" name="httpHardTimeout" onKeyPress="enableButtonLocal('btn_Apply', 'btn_Cancel');" SIZE="17" MAXLENGTH="3" VALUE="24">
                        <span class="argHelp">
                           (0 to 168)
                        </span>
                    </td>
                  </tr>
                  <tr class="deftestme whiteSpaceNoWrap">
                    <td class="defLeft">Maximum Number of HTTP Sessions</td>
                    <td class="defRight" colspan="3">
                        <INPUT TYPE="TEXT" class="input" id="httpMaxSessions" name="httpMaxSessions" onKeyPress="enableButtonLocal('btn_Apply', 'btn_Cancel');" SIZE="17" MAXLENGTH="2" VALUE="4">
                        <span class="argHelp"> 
                           (1 to 4)
                        </span>
                    </td>
                  </tr>


                </table>
              </td>
              <td class="subSectionBodyDotRight">&nbsp;</td>
            </tr>
            <tr>
              <td colspan="3" class="subSectionBottom">&nbsp;</td>
            </tr>
        </table></td>
      </tr>
    </table>
  </div>
  <script>
    var str = CreateButtons('image', 'Cancel', 'cancelform()', 'btn_Cancel');
    str += CreateButtons('image', 'Apply', 'submitformForHTTP()', 'btn_Apply');
    PaintButtons(str);
  </script>
      <INPUT TYPE="hidden" id="submt" NAME="submt" SIZE="16" MAXLENGTH="15" VALUE="">
      <INPUT TYPE="hidden" id="cncel" NAME="cncel" SIZE="16" MAXLENGTH="15" VALUE="">
      <INPUT TYPE="hidden" NAME="err_flag" SIZE="16" MAXLENGTH="15" VALUE="0">
      <INPUT TYPE="hidden" NAME="err_msg" SIZE="128" MAXLENGTH="512" VALUE="">
</FORM>
<iframe TYPE="hidden" frameborder="no" name="hidden_frame" id="hidden_frame" src="" style="display: none;">
</iframe>
</body>
