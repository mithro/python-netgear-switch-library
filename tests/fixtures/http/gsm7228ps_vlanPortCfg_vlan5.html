function mouseDownWork(event)
{
  // process only left clicks
  var processedClick = document.getElementsByName("processedClick")[0]
  processedClick.value = 0
  if (event.button > 1)
    return true;
  var ignoreMouseUp = document.getElementsByName("ignoreMouseUp")[0]
  var mouseX = document.getElementsByName("mouseX")[0]
  var mouseY = document.getElementsByName("mouseY")[0]
  if (ignoreMouseUp.value == 1)
  {
    ignoreMouseUp.value = 0
  }
  if (event.ctrlKey && !event.altKey && !event.shiftKey)
  {
    ignoreMouseUp.value = 1
  }
  mouseX.value = event.clientX;
  mouseY.value = event.clientY;
}


function toggleImageFirst(obj, index, indexLength, prntid, intfNumb)
{
  var processedClick = document.getElementsByName("processedClick")[0]
  var ignoreMouseUp = document.getElementsByName("ignoreMouseUp")[0]
  var selectedPorts = document.getElementsByName("selectedPorts")[0]
  str = 'g' + intfNumb + ';';
  if (ignoreMouseUp.value == 1)
  {
    if (selectedPorts.value.search(str) != -1)
    {
      selectedPorts.value = selectedPorts.value.replace(str, '')
    }
    else
    {
      selectedPorts.value += str
    }
  }
  else
  {
    if (selectedPorts.value.search(str) != -1)
    {
      ignoreMouseUp.value = 1;
      // toggle current image
      toggleImage(obj, index, indexLength, prntid)
      // toggle other images
      srcOb1 = obj.childNodes[0].src
      var imagesList = document.getElementsByName("imx")
      for (i=0;i <imagesList.length; i++)
      {
        str1 = 'g' + imagesList[i].id + ';'
        if (selectedPorts.value.search(str1) != -1)
        {
          if (str != str1)
          {
            var unitStr = imagesList[i].parentNode.parentNode.innerHTML
            var indexStr = unitStr
            indexStr = indexStr.slice(indexStr.search('this,')+5)
            indexStr = indexStr.substr(0, indexStr.search(","))
            unitStr = unitStr.slice(unitStr.search('img_unit'))
            unitStr = unitStr.substr(0, unitStr.search("'"))
            while (imagesList[i].src != srcOb1)
            {
              toggleImage(imagesList[i].parentNode, indexStr, indexLength, unitStr)
            }
          }
        }
      }
      enablebtn(1)
    }
    else
    {
      selectedPorts.value = 'g' + intfNumb + ';'
      toggleImage(obj, index, indexLength, prntid)
      enablebtn(1)
    }
  }
  processedClick.value = 1
}

function mouseUpWork(event)
{
  // process only left clicks
  if (event.button > 1)
      return true;
  var userSelection
  var iexplorer
  var ignoreMouseUp = document.getElementsByName("ignoreMouseUp")[0]
  var selectedPorts = document.getElementsByName("selectedPorts")[0]
  var mouseX = document.getElementsByName("mouseX")[0]
  var mouseY = document.getElementsByName("mouseY")[0]
  var processedClick = document.getElementsByName("processedClick")[0]
  if (ignoreMouseUp.value == 1)
  {
    return
  }
  if(mouseX.value == event.clientX && mouseY.value == event.clientY)
  {
    return
  }
  if (window.getSelection) {
    userSelection = window.getSelection()
    iexplorer = 0
  }
  else
    if (document.selection) { // should come last: IE, Opera
      userSelection = document.selection.createRange()
      iexplorer = 1
  }
  if (iexplorer == 0)
  {
      var range = document.createRange()
      if (!userSelection.anchorNode)
      {
        return
      }
      range = userSelection.getRangeAt(0);
      if (!range.collapsed)
      {
        selectedPorts.value = '';
        var innerRange = document.createRange();
        var imageNodes = document.getElementsByName("imx")
        for (j=0; j<imageNodes.length; j++)
        {
          if (imageNodes[j].id)
          {
            if (imageNodes[j].id.search('img_unit') == -1)
            {
              innerRange.selectNode(imageNodes[j])
              if ((range.compareBoundaryPoints(Range.START_TO_START, innerRange) <= 0) &&
                  (range.compareBoundaryPoints(Range.END_TO_END, innerRange) >= 0))
              {
                selectedPorts.value += 'g' + imageNodes[j].id + ';'
              }
            }
          }
        }
        innerRange.detach()
        window.getSelection().collapseToEnd()
      }
      range.detach()
  }
  else
  {
     if(userSelection.htmlText)
     {
       selectedPorts.value = ""
       var imageNodes = document.getElementsByName("imx")
       var innerRange = document.body.createTextRange()
       for (j=0; j<imageNodes.length; j++)
       {
         if(imageNodes[j].id)
         {
           if (imageNodes[j].id.search('img_unit') == -1)
           {
             innerRange.moveToElementText(imageNodes[j])
             if (userSelection.inRange(innerRange))
             {
               selectedPorts.value += 'g' + imageNodes[j].id + ';'
             }
           }
         }
       }
       document.selection.empty()
     }
  }
  processedClick.value = 1
}

function checkIfClickProcessed()
{
  var processedClick = document.getElementsByName("processedClick")[0]
  var selectedPorts = document.getElementsByName("selectedPorts")[0]
  if (processedClick.value != 1)
  {
    selectedPorts.value = ""
  }
}

/* emulates mouse click if the interface
   should be toggled by a space button */
$(document).ready(function() {
   $(document).keydown(function(e) {
     if (e.keyCode == '32') {
       e.preventDefault(); // Prevent the default action
       var focusedImg = document.activeElement;
       if ((focusedImg != null) && (focusedImg != undefined) && (focusedImg.children[0] != undefined))
       {
         if (typeof focusedImg.children[0].onclick == "function") {
         focusedImg.children[0].onclick.apply(focusedImg.children[0]);
         }
       }
     }
   });
 });

function emulateMouseClick(handle, event)
{
  // IE7+ fix
  var keyCode = (event.charCode) ? event.charCode : event.keyCode;

  if (keyCode == 32) /* 32 - key code for the space button */
  { 
    document.getElementsByName("processedClick")[0].value = "0";
    document.getElementsByName("ignoreMouseUp")[0].value = "0";
    handle.onclick(); /* call onclick to toggle image */
  }
}

function saveUnitRowState(unit)
{
  // global variable
  var unitRowStates = document.getElementById('unitRowState');
  --unit;
  (unitRowStates.value & (1 << unit)) ? (unitRowStates.value &= ~ (1 << unit)) : unitRowStates.value |= (1 << unit);
}

function toggleUnitRows()
{
  var unitRowStates = document.getElementById('unitRowState');
  var maxNumOfUnits = 7;

  for (var i = 0; i <= maxNumOfUnits; i++)
  {
    if (unitRowStates.value & (1 << i))
    {
      var td = document.getElementById('td_unit_' + (i + 1));
      td.onclick();
    }
  }
}

function showUnits()
{
  var unitRowStates = document.getElementById('unitRowState');
  var maxNumOfUnits = 7;

  for (var i = 0; i <= maxNumOfUnits; i++)
  {
    if (unitRowStates.value & (1 << i))
    {
      toggleLyr('unit' + (i + 1));
      chngeImg(document.getElementById('td_unit_' + (i + 1)), 'unit' + (i + 1));
    }
  }
}
